name: Build and Test Triton (AMD)

on:
  push:
    branches:
      - main-windows
      - main-windows-staged
  pull_request:
    branches:
      - main-windows
      - main-windows-staged
  workflow_dispatch:
    inputs:
      git_tag:
        description: Git tag, leave blank to use the triggering branch
        required: false
        type: string
      python_minor:
        description: Python minor version
        required: true
        type: string
        default: '12'
      is_python_abi3:
        description: Is Python ABI3
        required: false
        type: boolean
        default: true
      rocm_version:
        description: 'ROCm version (e.g. 10.1.0a20260823). Leave empty to use the latest ROCm and PyTorch wheels'
        required: false
        type: string
        default: ''
      torch_version:
        description: 'PyTorch version (e.g. 2.14.0). Required when rocm_version is set'
        required: false
        type: string
        default: ''
      pytest_args:
        description: pytest args
        required: true
        type: string
        default: '-n 8 --tb=short'

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  build-and-test-triton:
    runs-on: triton-windows1
    env:
      PIP_CACHE_DIR: E:\pip-cache
      PYTHON_MINOR: ${{ inputs.python_minor || '12' }}
      IS_PYTHON_ABI3: ${{ github.event_name != 'workflow_dispatch' || inputs.is_python_abi3 }}
      ROCM_VERSION: ${{ inputs.rocm_version }}
      TORCH_VERSION: ${{ inputs.torch_version }}
      PYTEST_ADDOPTS: ${{ inputs.pytest_args || '-n 8 --tb=short' }}
    steps:
      - name: Validate inputs
        shell: powershell
        run: |
          if ($Env:ROCM_VERSION -and -not $Env:TORCH_VERSION)
          {
            throw "torch_version is required when rocm_version is set"
          }

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Clean caches
        shell: powershell
        run: |
          if (Test-Path -Path ~/.triton) { rm -r ~/.triton }
          if (Test-Path -Path triton-windows/build) { rm -r -Force triton-windows/build }
          if (Test-Path -Path triton-windows/python/build) { rm -r triton-windows/python/build }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_tag || github.ref }}
          path: triton-windows
          fetch-depth: 1

      - name: Create venv
        shell: powershell
        run: |
          uv venv ".venv-cp3$Env:PYTHON_MINOR" --python "3.$Env:PYTHON_MINOR" --clear
          & ".venv-cp3$Env:PYTHON_MINOR\Scripts\activate.ps1"
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip

      - name: Build wheel
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64
          & ".venv-cp3$Env:PYTHON_MINOR\Scripts\activate.ps1"
          python -m pip install --upgrade cibuildwheel

          cd triton-windows
          git rev-parse HEAD

          $Env:TRITON_BUILD_PROTON = "0"
          $Env:CIBW_BUILD_VERBOSITY = "1"

          if ($Env:IS_PYTHON_ABI3 -eq "true")
          {
            $Env:CIBW_BUILD = "cp312-win_amd64"
            $Env:TRITON_STABLE_ABI = "ON"
          }
          else
          {
            $Env:CIBW_BUILD = "{cp3$Env:PYTHON_MINOR-win_amd64,}"
          }

          if (Test-Path -Path wheelhouse)
          {
            rm wheelhouse/*
          }

          if (Test-Path -Path setup.py)
          {
            cibuildwheel .
          }
          else
          {
            cibuildwheel python
          }

      - uses: actions/upload-artifact@v7
        with:
          path: triton-windows/wheelhouse/*

      - name: Unit test
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64
          & ".venv-cp3$Env:PYTHON_MINOR\Scripts\activate.ps1"
          python -m pip install --upgrade cloudpickle numpy pytest-xdist pytest-timeout scipy expecttest

          $indexUrl = "https://nightly.repo.amd.com/rocm/whl-next/"
          if ($Env:ROCM_VERSION)
          {
            $torchVersion = "$Env:TORCH_VERSION+rocm$Env:ROCM_VERSION"
            python -m pip install --index-url $indexUrl "rocm[libraries,devel,device-gfx1101]==$Env:ROCM_VERSION" "torch[device-gfx1101]==$torchVersion"
          }
          else
          {
            # Install torch first so the resolver picks the latest nightly torch together
            # with the exact ROCm version it was built against (torch pins rocm[libraries]).
            # Requesting unpinned rocm[...] in the same command makes the resolver pick the
            # newest ROCm, then backtrack torch through many nightly builds to find a match.
            python -m pip install --pre --index-url $indexUrl "torch[device-gfx1101]"
            $rocmVersion = python -c "from importlib.metadata import version; print(version('rocm'))"
            python -m pip install --index-url $indexUrl "rocm[libraries,devel,device-gfx1101]==$rocmVersion"
          }

          # Expand rocm[devel] once, in a single process, before pytest starts.
          # The first-use expansion takes a non-blocking lock, so with pytest-xdist
          # the workers race and all but one end up with `_rocm_root is None`.
          python -m rocm_sdk init

          cd triton-windows/wheelhouse
          python -m pip install $(Get-ChildItem | Select-Object -First 1)
          cd ../python/test/unit
          $pytestArgs = @("--confcutdir=..")
          if (Test-Path ..\..\conftest.py)
          {
            # Load shared fixtures without letting the folder `python\` shadow the installed wheel.
            $Env:PYTHONPATH = (Resolve-Path ..\..\..).Path
            $pytestArgs += @("-p", "python.conftest")
          }
          python -m pytest @pytestArgs
