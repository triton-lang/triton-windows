name: Build and Test Triton (AMD)

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: Git tag
        required: true
        type: string
        default: main-windows
      python_minor:
        description: Python minor version
        required: true
        type: string
        default: '13'
      rocm_major:
        description: ROCm major version
        required: true
        type: string
        default: '7'
      rocm_minor:
        description: ROCm minor version
        required: true
        type: string
        default: '13'
      rocm_date:
        description: ROCm nightly date
        required: true
        type: string
        default: '20260419'
      torch_minor:
        description: PyTorch minor version
        required: true
        type: string
        default: '10'
      pytest_args:
        description: pytest args
        required: true
        type: string
        default: '-n 8 --tb=short'

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    with:
      git_tag: ${{ inputs.git_tag }}

  build-and-test-triton:
    runs-on: triton-windows1
    env:
      PIP_CACHE_DIR: E:\pip-cache
      PYTHON_MINOR: ${{ inputs.python_minor }}
      ROCM_MAJOR: ${{ inputs.rocm_major }}
      ROCM_MINOR: ${{ inputs.rocm_minor }}
      ROCM_DATE: ${{ inputs.rocm_date }}
      TORCH_MINOR: ${{ inputs.torch_minor }}
      PYTEST_ADDOPTS: ${{ inputs.pytest_args }}
    steps:
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Clean caches
        shell: powershell
        run: |
          if (Test-Path -Path ~/.triton) { rm -r ~/.triton }
          if (Test-Path -Path triton-windows/build) { rm -r -Force triton-windows/build }
          if (Test-Path -Path triton-windows/python/build) { rm -r triton-windows/python/build }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_tag || github.ref }}
          path: triton-windows
          fetch-depth: 1

      - name: Create venv
        shell: powershell
        run: |
          uv venv ".venv-cp3$Env:PYTHON_MINOR" --python "3.$Env:PYTHON_MINOR" --clear
          & ".venv-cp3$Env:PYTHON_MINOR\Scripts\activate.ps1"
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip

      - name: Build wheel
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64
          & ".venv-cp3$Env:PYTHON_MINOR\Scripts\activate.ps1"
          python -m pip install --upgrade cibuildwheel

          cd triton-windows
          git rev-parse HEAD

          $Env:TRITON_BUILD_PROTON = "0"
          $Env:CIBW_BUILD = "{cp3$Env:PYTHON_MINOR-win_amd64,}"
          $Env:CIBW_BUILD_VERBOSITY = "1"
          if (Test-Path -Path wheelhouse) { rm wheelhouse/* }
          if (Test-Path -Path setup.py)
          {
            cibuildwheel .
          }
          else
          {
            cibuildwheel python
          }

      - uses: actions/upload-artifact@v7
        with:
          path: triton-windows/wheelhouse/*

      - name: Unit test
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64
          & ".venv-cp3$Env:PYTHON_MINOR\Scripts\activate.ps1"
          python -m pip install --upgrade cloudpickle numpy pytest-xdist pytest-timeout scipy expecttest

          $rocmVersion = "$Env:ROCM_MAJOR.$Env:ROCM_MINOR.0a$Env:ROCM_DATE"
          $torchVersion = "2.$Env:TORCH_MINOR.0+rocm$rocmVersion"
          if ([int]::Parse($Env:ROCM_DATE) -ge 20260520)
          {
            $indexUrl = "https://rocm.nightlies.amd.com/whl-multi-arch/"
            $rocmRequirement = "rocm[libraries,devel,device-gfx1101]==$rocmVersion"
            $torchRequirement = "torch[device-gfx1101]==$torchVersion"
          }
          else
          {
            $indexUrl = "https://rocm.nightlies.amd.com/v2/gfx110X-all/"
            $rocmRequirement = "rocm[libraries,devel]==$rocmVersion"
            $torchRequirement = "torch==$torchVersion"
          }
          python -m pip install --index-url $indexUrl $rocmRequirement $torchRequirement

          cd triton-windows/wheelhouse
          python -m pip install $(Get-ChildItem | Select-Object -First 1)
          cd ../python/test/unit
          # Load shared fixtures without letting the folder `python\` shadow the installed wheel.
          $Env:PYTHONPATH = (Resolve-Path ..\..\..).Path
          python -m pytest --confcutdir=.. -p python.conftest
