name: Build Triton

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: Git tag
        required: true
        type: string
        default: main-windows
      triton_wheel_version_suffix:
        description: Triton wheel version suffix
        required: false
        type: string
        default: ''
      triton_build_binary:
        description: Build binary executables
        required: true
        type: string
        default: '0'
      triton_build_proton:
        description: Build Proton
        required: true
        type: string
        default: '0'
      triton_build_ut:
        description: Build C++ unit tests
        required: true
        type: string
        default: '0'
      triton_rel_build_with_asserts:
        description: Build with PDB and asserts
        required: true
        type: string
        default: '0'
      is_python_abi3:
        description: Is Python ABI3
        required: false
        type: boolean
        default: false
      cibw_build_override:
        description: CIBW_BUILD override
        required: false
        type: string
        default: ''

jobs:
  resolve-ref:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_tag }}
          path: triton-windows

      - id: resolve
        shell: powershell
        run: |
          cd triton-windows
          "commit_sha=$(git rev-parse HEAD)" >> $Env:GITHUB_OUTPUT

  build-triton:
    name: Build ${{ inputs.git_tag }} (${{ matrix.architecture }}) @ ${{ needs.resolve-ref.outputs.commit_sha }}
    needs: resolve-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            msvc_arch: x64
            cibw_arch: AMD64
            cibw_build: cp3{10,11,12,13,14}
            cibw_pre_abi3_build: cp3{10,11}
            wheel_platform: win_amd64
          - architecture: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            cibw_arch: ARM64
            cibw_build: cp3{11,12,13,14}
            cibw_pre_abi3_build: cp311
            wheel_platform: win_arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Configure Git
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.commit_sha }}
          path: triton-windows

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build wheels
        shell: powershell
        env:
          TRITON_WHEEL_VERSION_SUFFIX: ${{ inputs.triton_wheel_version_suffix }}
          TRITON_BUILD_BINARY: ${{ inputs.triton_build_binary }}
          TRITON_BUILD_PROTON: ${{ inputs.triton_build_proton }}
          TRITON_BUILD_UT: ${{ inputs.triton_build_ut }}
          TRITON_REL_BUILD_WITH_ASSERTS: ${{ inputs.triton_rel_build_with_asserts }}
          IS_PYTHON_ABI3: ${{ inputs.is_python_abi3 }}
          CIBW_BUILD_OVERRIDE: ${{ inputs.cibw_build_override }}
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_DEFAULT_BUILD: ${{ matrix.cibw_build }}
          CIBW_PRE_ABI3_BUILD: ${{ matrix.cibw_pre_abi3_build }}
          WHEEL_PLATFORM: ${{ matrix.wheel_platform }}
        run: |
          # Get-ChildItem Env:
          # (Get-WmiObject Win32_Processor).Name
          # (Get-WmiObject Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB
          # (Get-WmiObject Win32_VideoController).Name

          # Get-Command -All python
          # python --version
          python -m pip install --upgrade pip
          pip install --upgrade cibuildwheel

          cd triton-windows
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          git rev-parse HEAD
          git for-each-ref --contains HEAD --format "%(refname:short)"

          $Env:CIBW_BUILD_VERBOSITY = "1"

          if ($Env:IS_PYTHON_ABI3 -eq "true")
          {
            if ($Env:CIBW_BUILD_OVERRIDE)
            {
              $Env:CIBW_BUILD = $Env:CIBW_BUILD_OVERRIDE
              $Env:TRITON_STABLE_ABI = "ON"
              cibuildwheel .
            }
            else
            {
              $Env:CIBW_BUILD = "$Env:CIBW_PRE_ABI3_BUILD-$Env:WHEEL_PLATFORM"
              cibuildwheel .

              $Env:CIBW_BUILD = "cp312-$Env:WHEEL_PLATFORM"
              $Env:TRITON_STABLE_ABI = "ON"
              cibuildwheel .
            }
          }
          else
          {
            if ($Env:CIBW_BUILD_OVERRIDE)
            {
              $Env:CIBW_BUILD = $Env:CIBW_BUILD_OVERRIDE
            }
            else
            {
              $Env:CIBW_BUILD = "$Env:CIBW_DEFAULT_BUILD-$Env:WHEEL_PLATFORM"
            }

            if (Test-Path -Path setup.py)
            {
              cibuildwheel .
            }
            else
            {
              cibuildwheel python
            }
          }

      - uses: actions/attest@v4
        with:
          subject-path: triton-windows/wheelhouse/*.whl

      # Currently actions/upload-artifact only supports uploading one file at a time when archive is disabled
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.architecture == 'x64' }}
        with:
          path: triton-windows/wheelhouse/*-cp310-cp310-${{ matrix.wheel_platform }}.whl
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: triton-windows/wheelhouse/*-cp311-cp311-${{ matrix.wheel_platform }}.whl
          archive: false

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.is_python_abi3 }}
        with:
          path: triton-windows/wheelhouse/*-cp312-abi3-${{ matrix.wheel_platform }}.whl
          archive: false

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.is_python_abi3 }}
        with:
          path: triton-windows/wheelhouse/*-cp312-cp312-${{ matrix.wheel_platform }}.whl
          archive: false

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.is_python_abi3 }}
        with:
          path: triton-windows/wheelhouse/*-cp313-cp313-${{ matrix.wheel_platform }}.whl
          archive: false

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.is_python_abi3 }}
        with:
          path: triton-windows/wheelhouse/*-cp314-cp314-${{ matrix.wheel_platform }}.whl
          archive: false
